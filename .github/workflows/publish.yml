name: Publish Row360 APK

on:
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'tools/publish_release.py'
      - 'release-policy.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: row360-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify APK and update manifest
        run: python3 tools/publish_release.py --verify
      - name: Publish verified release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if python3 tools/publish_release.py --publish; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1
